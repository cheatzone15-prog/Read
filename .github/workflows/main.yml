name: Bot Compilation and Run Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build tools
      run: sudo apt update && sudo apt install -y build-essential

    # ========================
    # 1. Compile normal bot (to verify compilation)
    # ========================
    - name: Compile bot (native x86_64)
      run: gcc -o bot bot.c -lpthread

    - name: Verify bot binary
      run: file bot | grep -q "executable" && echo "✅ bot is executable"

    # ========================
    # 2. Create a debug version (no daemonize) for runtime test
    # ========================
    - name: Create debug bot (no daemonize)
      run: |
        cp bot.c bot_debug.c
        # Comment out daemonize line
        sed -i 's/^[[:space:]]*daemonize(argc, argv);/\/\/ daemonize(argc, argv);/' bot_debug.c
        # Compile statically to avoid missing libs
        gcc -static -o bot_debug bot_debug.c -lpthread

    # ========================
    # 3. Run debug bot in background and check if it stays alive
    # ========================
    - name: Run debug bot (test mode)
      run: |
        ./bot_debug default &
        sleep 2
        if pgrep -f "bot_debug"; then
          echo "✅ Bot is running (process found)"
          pkill -f bot_debug || true
        else
          echo "❌ Bot did not start or crashed immediately"
          exit 1
        fi

    # ========================
    # (Optional) Compile CNC if you want to test both
    # ========================
    - name: (Optional) Compile CNC server
      run: |
        if [ -f cnc.c ]; then
          gcc -o cnc cnc.c -lpthread
          file cnc | grep -q "executable" && echo "✅ CNC compiled"
        else
          echo "⚠️ cnc.c not found, skipping"
        fi
